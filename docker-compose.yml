name: ob-semantic

services:
  volume-init:
    image: alpine:3.22
    command:
      - /bin/sh
      - -c
      - |
          set -eu
          echo "Initializing Semantica persistent volumes"
          mkdir -p /data-root/falkordb/data
          echo "Semantica volume initialization complete"
    volumes:
      - ${DATA_ROOT:?DATA_ROOT must be set in .env}:/data-root
    restart: "no"

  explorer:
    build:
      context: .
      dockerfile: Dockerfile
    image: semantica-knowledge-explorer:latest
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      # Required for API access - the Explorer refuses all protected routes
      # (503) until this is set. Generate one with `openssl rand -hex 32`.
      SEMANTICA_API_KEY: ${SEMANTICA_API_KEY:?SEMANTICA_API_KEY must be set in .env}
      # Trusted local-only setups only: bypasses the API key entirely.
      SEMANTICA_ALLOW_ANONYMOUS: "false"
      VECTOR_STORE_DEFAULT_BACKEND: ${VECTOR_STORE_DEFAULT_BACKEND:-qdrant}
      VECTOR_STORE_DIMENSION: ${VECTOR_STORE_DIMENSION:-768}
      VECTOR_STORE_QDRANT_URL: ${VECTOR_STORE_QDRANT_URL:-http://qdrant-mem0:6333}
      VECTOR_STORE_QDRANT_API_KEY: ${VECTOR_STORE_QDRANT_API_KEY:-}
    depends_on:
      falkordb:
        condition: service_started
    networks:
      front-net:
        aliases:
          - semantica-explorer
      back-net:
        aliases:
          - semantica-explorer
      db-net: {}
    restart: unless-stopped

  falkordb:
    image: falkordb/falkordb:latest
    depends_on:
      volume-init:
        condition: service_completed_successfully
    volumes:
      - falkordb_persistent_data:/var/lib/falkordb/data
    networks:
      - db-net
    restart: unless-stopped

networks:
  front-net:
    external: true
    name: ob-net-front
  back-net:
    external: true
    name: ob-net-back
  db-net:
    external: true
    name: ob-net-db

volumes:
  falkordb_persistent_data:
    driver: local
    driver_opts:
      type: none
      device: ${DATA_ROOT:?DATA_ROOT must be set in .env}/falkordb/data
      o: bind
