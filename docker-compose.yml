name: ob-semantic

services:
  explorer:
    build:
      context: .
      dockerfile: Dockerfile
    image: semantica-knowledge-explorer:latest
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      # Required for API access - the Explorer refuses all protected routes
      # (503) until this is set. Generate one with `openssl rand -hex 32`.
      SEMANTICA_API_KEY: ${SEMANTICA_API_KEY:-}
      # Trusted local-only setups only: bypasses the API key entirely.
      SEMANTICA_ALLOW_ANONYMOUS: ${SEMANTICA_ALLOW_ANONYMOUS:-false}
      VECTOR_STORE_DEFAULT_BACKEND: ${VECTOR_STORE_DEFAULT_BACKEND:-qdrant}
      VECTOR_STORE_DIMENSION: ${VECTOR_STORE_DIMENSION:-768}
      VECTOR_STORE_QDRANT_URL: ${VECTOR_STORE_QDRANT_URL:-http://qdrant-mem0:6333}
      VECTOR_STORE_QDRANT_API_KEY: ${VECTOR_STORE_QDRANT_API_KEY:-}
    depends_on:
      falkordb:
        condition: service_started
    ports:
      - "${SEMANTICA_EXPLORER_BIND_HOST:-127.0.0.1}:${SEMANTICA_EXPLORER_PORT:-8001}:8000"
    networks:
      - back-net
      - db-net
    restart: unless-stopped

  falkordb:
    image: falkordb/falkordb:latest
    volumes:
      - falkordb_data:/data
    networks:
      - db-net
    restart: unless-stopped

networks:
  back-net:
    external: true
    name: ob-net-back
  db-net:
    external: true
    name: ob-net-db

volumes:
  falkordb_data:
